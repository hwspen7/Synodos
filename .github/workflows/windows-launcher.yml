name: Windows Launcher Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'Start-Meeting.cmd'
      - 'tools/windows/Start-Meeting.ps1'
      - 'tools/run_nemotron_ami.ps1'
      - 'tools/run_phase1_engineering.ps1'
      - 'tools/diagnose_github_actions.ps1'
      - 'tools/resolve_private_ci_path.ps1'
      - 'tests/windows/test_ci_report_path.ps1'
      - 'tools/run_phase1_closure.ps1'
      - 'tools/run_phase12_acceptance.ps1'
      - 'tools/run_phase1a_ablation.ps1'
      - 'tools/run_phase1b_compare.ps1'
      - 'tools/run_asr_coverage_pair.ps1'
      - 'tools/check_phase12_integrity.ps1'
      - '.github/workflows/windows-launcher.yml'
  pull_request:
    paths:
      - 'Start-Meeting.cmd'
      - 'tools/windows/Start-Meeting.ps1'
      - 'tools/run_nemotron_ami.ps1'
      - 'tools/run_phase1_engineering.ps1'
      - 'tools/diagnose_github_actions.ps1'
      - 'tools/resolve_private_ci_path.ps1'
      - 'tests/windows/test_ci_report_path.ps1'
      - 'tools/run_phase12_acceptance.ps1'
      - 'tools/run_phase1a_ablation.ps1'
      - 'tools/run_phase1b_compare.ps1'
      - 'tools/run_asr_coverage_pair.ps1'
      - 'tools/check_phase12_integrity.ps1'
      - '.github/workflows/windows-launcher.yml'

jobs:
  powershell-parser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          $scripts = @(
            'tools/windows/Start-Meeting.ps1',
            'tools/run_nemotron_ami.ps1',
            'tools/run_phase1_engineering.ps1',
            'tools/diagnose_github_actions.ps1',
            'tools/resolve_private_ci_path.ps1',
            'tools/run_phase1_closure.ps1',
            'tools/run_phase12_acceptance.ps1',
            'tools/run_phase1a_ablation.ps1',
            'tools/run_phase1b_compare.ps1',
            'tools/run_asr_coverage_pair.ps1',
            'tools/check_phase12_integrity.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -ne 0) {
              $parseErrors | Format-List -Force
              exit 1
            }
            Write-Output "Windows PowerShell 5.1 syntax OK - $script"
          }
      - name: Verify process identity guards
        shell: powershell
        run: .\tests\windows\test_launcher_safety.ps1
      - name: Verify CI evidence path handling (rooted and relative)
        shell: powershell
        run: .\tests\windows\test_ci_report_path.ps1
