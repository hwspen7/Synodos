name: Windows Launcher Validation

on:
  push:
    paths:
      - 'Start-Meeting.cmd'
      - 'tools/windows/Start-Meeting.ps1'
      - '.github/workflows/windows-launcher.yml'
  pull_request:
    paths:
      - 'Start-Meeting.cmd'
      - 'tools/windows/Start-Meeting.ps1'
      - '.github/workflows/windows-launcher.yml'

jobs:
  powershell-parser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/windows/Start-Meeting.ps1').Path,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | Format-List -Force
            exit 1
          }
          Write-Output 'Windows PowerShell 5.1 syntax OK'
