name: Meeting knowledge release contract

on:
  pull_request:
  push:
    branches:
      - feature/meeting-knowledge-quality
  workflow_dispatch:

jobs:
  meeting_knowledge_quality:
    name: Meeting knowledge deterministic release invariants
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate strict release contracts
        run: python -m unittest tests.release.test_meeting_knowledge_quality tests.release.test_meeting_reference_corpus -v
      - name: Compile new release tools
        run: >-
          python -m compileall -q
          tools/validation/meeting_knowledge_contract.py
          tools/validation/meeting_release_gate.py
          tools/maintenance/meeting_knowledge_benchmark.py
          tools/diagnostics/meeting_audio_review_export.py
      - name: Assert no secrets or fabricated GPU acceptance in hosted CI
        run: |
          python - <<'PY'
          from tools.validation.meeting_knowledge_contract import release_decision
          assert not release_decision({"schema":"meeting-knowledge-baseline-freeze","pass": True,"reports":{"lexical":{},"hybrid":{}}})["overall_product_release_pass"]
          PY
