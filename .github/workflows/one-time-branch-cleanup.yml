name: One-time branch archive and cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'hwspen7/Synodos'
    runs-on: ubuntu-latest
    steps:
      - name: Archive unmerged work and retire historical branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"

          # Verify all eight old branch refs before doing anything irreversible.
          while IFS='|' read -r branch expected; do
            test -n "$branch" || continue
            actual="$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha')"
            if [[ "$actual" != "$expected" ]]; then
              echo "Branch changed: $branch (expected $expected, actual $actual)" >&2
              exit 1
            fi
          done <<'EXPECTED_REFS'
          codex/fixed10-quality-repair-12lang|367a6e297ce131cee9008728dd249b616056440e
          feature/multilingual-fixed10-ui-refresh|dfd942b19b2eb005505ee54702d0338dc4be22a3
          fix/ts3003b-integrity-forensics-20261104|b5382f250f644be0e17aae36f7267619a02873a9
          quality/ts3003b-audio-first-20261104|e61c0a5848dbe5e2dd43e055a01d13faf3c40e8f
          quality/ts3003b-integrated-20261104|b83782658f0882fc66c31575d692ef4b62960bef
          refactor/flatten-project-root|c3209c72c2a67db3277d33235bcad78de9f8fad3
          refactor/phase09-six-issues|ec381e83ab87aa3d08b8d40a16b280a7b2e65658
          upgrade/phase1-phase2-integrity-20261104|5b986a8b5fb2b13d94aa0b7e73c09a5a041f65d2
          EXPECTED_REFS

          # Preserve three branches containing commits not yet in main as
          # recovery tags. These are tags, not active branches.
          gh api -X POST "repos/$repo/git/refs" \
            -f ref='refs/tags/archive/2026-11-07/codex-fixed10-quality-repair' \
            -f sha='367a6e297ce131cee9008728dd249b616056440e'
          gh api -X POST "repos/$repo/git/refs" \
            -f ref='refs/tags/archive/2026-11-07/quality-audio-first' \
            -f sha='e61c0a5848dbe5e2dd43e055a01d13faf3c40e8f'
          gh api -X POST "repos/$repo/git/refs" \
            -f ref='refs/tags/archive/2026-11-07/quality-integrated' \
            -f sha='b83782658f0882fc66c31575d692ef4b62960bef'

          # Only the explicit list below can be deleted. Neither main nor
          # feature/meeting-knowledge-quality appears here.
          while IFS='|' read -r branch expected; do
            test -n "$branch" || continue
            echo "Deleting historical branch $branch"
            gh api -X DELETE "repos/$repo/git/refs/heads/$branch"
          done <<'EXPECTED_REFS'
          codex/fixed10-quality-repair-12lang|367a6e297ce131cee9008728dd249b616056440e
          feature/multilingual-fixed10-ui-refresh|dfd942b19b2eb005505ee54702d0338dc4be22a3
          fix/ts3003b-integrity-forensics-20261104|b5382f250f644be0e17aae36f7267619a02873a9
          quality/ts3003b-audio-first-20261104|e61c0a5848dbe5e2dd43e055a01d13faf3c40e8f
          quality/ts3003b-integrated-20261104|b83782658f0882fc66c31575d692ef4b62960bef
          refactor/flatten-project-root|c3209c72c2a67db3277d33235bcad78de9f8fad3
          refactor/phase09-six-issues|ec381e83ab87aa3d08b8d40a16b280a7b2e65658
          upgrade/phase1-phase2-integrity-20261104|5b986a8b5fb2b13d94aa0b7e73c09a5a041f65d2
          EXPECTED_REFS

          echo "Remote branch cleanup finished."
