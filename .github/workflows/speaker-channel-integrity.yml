name: Speaker Channel and ASR Integrity

on:
  push:
    branches: [feature/meeting-knowledge-quality]
    paths:
      - "sessions/stable_speaker_channels.py"
      - "sessions/processor.py"
      - "sessions/session.py"
      - "speech/content_first_projection.py"
      - "speech/overlap_content_risk.py"
      - "tests/backend/test_stable_speaker_channels.py"
      - "tests/backend/test_speaker_display_projection.py"
      - "tests/backend/test_content_first_long_turn.py"
      - ".github/workflows/speaker-channel-integrity.yml"
  pull_request:
    paths:
      - "sessions/**"
      - "speech/**"
      - "tests/backend/test_stable_speaker_channels.py"
      - "tests/backend/test_speaker_display_projection.py"
      - "tests/backend/test_content_first_long_turn.py"

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install acoustic projection test dependency
        run: python -m pip install numpy
      - name: Stable speaker channels and source projection tests
        run: |
          python -m unittest tests.backend.test_stable_speaker_channels -v
          python -m unittest tests.backend.test_speaker_display_projection -v
      - name: Parse all changed backend modules and integration tests
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for filename in [
              'sessions/stable_speaker_channels.py',
              'sessions/processor.py',
              'sessions/session.py',
              'speech/content_first_projection.py',
              'speech/overlap_content_risk.py',
              'tests/backend/test_content_first_long_turn.py',
          ]:
              ast.parse(Path(filename).read_text(encoding='utf-8'), filename=filename)
              print('OK:', filename)
          PY
