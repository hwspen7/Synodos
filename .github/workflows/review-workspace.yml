name: Review Workspace UI

on:
  push:
    branches:
      - feature/meeting-knowledge-quality
    paths:
      - "src/pages/MeetingPage.vue"
      - "src/components/IntelligencePanel.vue"
      - "src/components/AppIcon.vue"
      - "src/assets/meeting-tool-layout.css"
      - "tests/frontend/meeting_tool_workspace.test.mjs"
      - "tests/frontend/review_simplification.test.mjs"
      - ".github/workflows/review-workspace.yml"
  pull_request:
    paths:
      - "src/pages/MeetingPage.vue"
      - "src/components/IntelligencePanel.vue"
      - "src/components/AppIcon.vue"
      - "src/assets/meeting-tool-layout.css"
      - "tests/frontend/**"

jobs:
  review-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - run: pnpm install --frozen-lockfile
      - name: Review navigation regression
        run: node --test tests/frontend/meeting_tool_workspace.test.mjs tests/frontend/review_simplification.test.mjs
      - name: Frontend type-check and build
        run: pnpm build
