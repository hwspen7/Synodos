name: One-time functional backend source layout
on:
  push:
    branches:
      - feature/meeting-knowledge-quality
permissions:
  contents: write
jobs:
  migrate:
    if: "!contains(github.event.head_commit.message, 'chore(layout): apply functional module organization')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal backend test dependencies
        run: python -m pip install "fastapi>=0.141.1" "numpy>=1.26" "scipy>=1.12" "soundfile>=0.12"
      - name: Reorganize source modules and rewrite references
        run: python tools/normalize_layout.py
      - name: Compile reorganized backend
        run: python -m compileall -q main.py api core inference intelligence runtime_quality sessions speech storage tools example ops tests
      - name: Run complete backend regression before committing
        run: python -m unittest discover -s tests -t . -v
      - name: Inspect migration and prevent frontend edits
        shell: bash
        run: |
          if git status --porcelain -- src/ public/ index.html package.json pnpm-lock.yaml | grep .; then
            echo "Frontend modifications are not allowed in this refactor."
            exit 1
          fi
          git status --short | tail -90
      - name: Commit validated layout changes only to development branch
        shell: bash
        run: |
          git config user.name "Spencer Qin"
          git config user.email "spencerqin@outlook.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(layout): apply functional module organization"
            git push origin HEAD:feature/meeting-knowledge-quality
          fi
