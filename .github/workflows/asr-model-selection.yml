name: ASR multilingual model selection contracts

on:
  push:
    branches:
      - feature/meeting-knowledge-quality
    paths:
      - 'tools/asr_model_selection.py'
      - 'speech/hybrid.py'
      - 'speech/qwen_bridge.py'
      - 'tests/release/test_asr_model_selection.py'
      - '.github/workflows/asr-model-selection.yml'
  pull_request:
  workflow_dispatch:

jobs:
  offline_contract:
    name: Paired ASR model selection fail-closed checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "numpy>=1.26" "soundfile>=0.13" scipy
      - run: python -m unittest tests.release.test_fleurs_asr_corpus tests.release.test_asr_model_selection -v
      - run: python -m compileall -q tools/freeze_fleurs_asr_corpus.py tools/asr_model_selection.py
