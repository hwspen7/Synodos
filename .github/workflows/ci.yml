name: Project validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - refactor/flatten-project-root
      - feature/meeting-knowledge-quality
  pull_request:

jobs:
  backend:
    name: Backend syntax and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies
        run: python -m pip install "fastapi>=0.141.1" "numpy>=1.26" "scipy>=1.12" "soundfile>=0.12"
      - name: Compile Python source
        run: python -m compileall -q main.py api audio core foundation inference intelligence observability phase07 sessions speech storage tools example tests
      - name: Verify Phase 1 content preservation and human-reference gates
        run: python -m unittest tests.quality.test_phase1_text_acceptance tests.quality.test_phase1_fixed195_text_gate tests.quality.test_phase1_language_policy tests.quality.test_ami_human_text_reference tests.quality.test_content_first_projection tests.quality.test_live_caption_segment_audit -v
      - name: Verify Phase 2 identity and review invariants
        run: python -m unittest tests.backend.unit.test_phase2_identity_matcher tests.backend.integration.test_phase2_manual_review -v
      - name: Phase 1B and Phase 2 deterministic experiment protocol checks
        run: python -m unittest tests.quality.test_phase1b_diarization tests.quality.test_phase1b_qwen_shadow tests.quality.test_phase2_cross_session_acceptance -v
      - name: Verify Phase 1/2 verified enrollment and strict release decision
        run: python -m unittest tests.quality.test_phase2_build_trials tests.quality.test_phase12_release_gate tests.backend.integration.test_phase2_verified_enrollment tests.backend.unit.test_phase2_identity_consensus -v
      - name: Phase 1A recovery candidate paired-evidence regression gate
        run: python -m unittest tests.quality.test_phase1a_quality_pair tests.quality.test_asr_quality_candidate tests.backend.unit.test_speech_gap_recovery tests.multilingual.test_quality_guard_04d -v
      - name: Phase 1A paired Whisper ablation regression gate
        run: python -m unittest tests.quality.test_phase1a_compare -v
      - name: Run backend and English-only tests
        run: python -m unittest discover -s tests -t . -v

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check Vue and TypeScript
        run: pnpm type-check
      - name: Build frontend
        run: pnpm build-only
      - name: Test realtime client lifecycle
        run: node --test tests/frontend/contracts/*.test.mjs

  postgres_integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: meeting_test
          POSTGRES_USER: meeting_test
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meeting_test -d meeting_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install database test dependencies
        run: python -m pip install "fastapi>=0.141.1" "numpy>=1.26" "psycopg[binary,pool]>=3.2,<4"
      - name: Test PostgreSQL storage, Phase 3 retrieval, and Phase 4 evidence integrity
        env:
          TEST_DATABASE_URL: postgresql://meeting_test:ci_only_password@localhost:5432/meeting_test
        run: python -m unittest tests.infrastructure.integration.test_postgres_optional tests.infrastructure.integration.test_meeting_knowledge_postgres tests.infrastructure.integration.test_meeting_knowledge_runner_postgres -v
