name: Frozen multilingual ASR selection corpus safety

on:
  push:
    branches:
      - feature/meeting-knowledge-quality
    paths:
      - 'tools/evaluation/corpora/freeze_fleurs_asr_corpus.py'
      - 'tests/release/test_fleurs_asr_corpus.py'
      - '.github/workflows/frozen-multilingual-asr.yml'
  pull_request:
  workflow_dispatch:

jobs:
  corpus_contract:
    name: Frozen FLEURS ASR corpus safety
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "numpy>=1.26" "soundfile>=0.13" scipy
      - run: python -m unittest tests.release.test_fleurs_asr_corpus -v
      - run: python -m compileall -q tools/evaluation/corpora/freeze_fleurs_asr_corpus.py
