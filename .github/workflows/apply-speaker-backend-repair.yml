name: Apply Speaker Backend Repair
on:
  push:
    branches: [feature/meeting-knowledge-quality]
    paths: [.github/workflows/apply-speaker-backend-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/meeting-knowledge-quality
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/repair_speaker_scope.py
      - run: python -m py_compile sessions/processor.py
      - name: Commit checked repair
        run: |
          git config user.name 'Meeting CI Repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sessions/processor.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix(backend): correct speaker profile matching scope'
            git push origin HEAD:refs/heads/feature/meeting-knowledge-quality
          fi
